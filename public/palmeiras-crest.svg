<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Palmeiras Hub">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a8a4a"/>
      <stop offset="55%" stop-color="#006437"/>
      <stop offset="100%" stop-color="#003d24"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001a10" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- Outer green disc -->
  <circle cx="64" cy="64" r="60" fill="url(#g)" filter="url(#soft)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="3.5" opacity=".95"/>
  <!-- Eight small white stars (foundation month motif) -->
  <g fill="#ffffff">
    <circle cx="64" cy="14" r="2.2"/>
    <circle cx="86" cy="20" r="2.2"/>
    <circle cx="102" cy="38" r="2.2"/>
    <circle cx="102" cy="62" r="2.2"/>
    <circle cx="86" cy="80" r="2.2"/>
    <circle cx="42" cy="80" r="2.2"/>
    <circle cx="26" cy="62" r="2.2"/>
    <circle cx="26" cy="38" r="2.2"/>
  </g>
  <!-- Inner white disc -->
  <circle cx="64" cy="64" r="34" fill="#ffffff"/>
  <!-- Soft green ring -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#006437" stroke-width="2.5"/>
  <!-- Stylized P -->
  <path d="M52 84 V44 H68 c10 0 16 5.5 16 14.5 S78 73 68 73 H60 V84 Z M60 52 v13 h7.5 c4.2 0 7-2.1 7-6.5 S71.7 52 67.5 52 Z" fill="#006437"/>
  <!-- Red star accent (classic Verdão) -->
  <path d="M64 96 l3.2 6.4 7 .9-5.2 4.9 1.3 6.9 L64 112 l-6.3 3.1 1.3-6.9-5.2-4.9 7-.9 Z" fill="#c8102e"/>
</svg>
